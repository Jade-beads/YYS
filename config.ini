[general]
Nthread=2	;total number of thread
debug=False	;debug to show detail error messages
game=yys	;game folder name
idle_warn=120	;认不出界面(没点击也没有意等待)超过这么多秒，在日志里提示一次；0=不提示
idle_stop=600	;超过这么多秒自动停止任务；0=不停。要比最长的一场战斗长
adb_path=	;可选：adb 可执行文件的完整路径，例如 D:\MuMu\shell\adb.exe。留空=自动检测
adb_address=	;可选：模拟器的 ADB 地址，例如 127.0.0.1:16384。留空=自动检测，检测不到时弹窗询问

[tupo]
tui=4	;个人突破(打8退N)：最后一个结界先退出几次再打掉
